name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }    # full history: the receipt checks the claims against the commit that sealed them
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests (the kit, the socket, recycling, markup)
        run: npm test
      - name: kard.json is what this repo's files show now
        run: npm run kard:check
      - name: mutation gate (witness) on the pure kernels
        # pinned to a tag so the verdict is about this code, not whatever witness was that morning
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git .witness
          node .witness/witness.mjs mutate socket.mjs  --cap 400 --test node --test socket.test.mjs
          node .witness/witness.mjs mutate recycle.mjs --cap 400 --test node --test recycle.test.mjs
          node .witness/witness.mjs mutate markup.mjs  --cap 400 --test node --test markup.test.mjs
      - name: the foundation's vendored kernels are byte-identical to their source repos at the pinned commits
        run: node core/tools/vendor.mjs --check
      - name: mutation gate on the foundation's own organs (witness v0.6; a survivor is killed, or baselined with a written reason in core/witness.baseline.json)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git .witness6
          # each test file runs in one process under the OS timeout, so a mutant that hangs is killed cleanly
          for k in antibody identity node judge edge mesh phase2/judge phase2/census relay roster phase3/judge phase3b/judge phase3c/judge selfmodel growth phase4/judge site mind egress phase5/judge phase5b/judge economy phase6/judge names phase6b/judge seed phase7/judge; do
            node .witness6/witness.mjs mutate core/$k.mjs --timeout 120000 --cap 1000 --test timeout -k 5 90 node core/$k.test.mjs | tee /tmp/w.txt
            grep -q '"clean": true' /tmp/w.txt || { echo "::error::mutants survived in core/$k.mjs"; exit 1; }
            grep -q '"capped": false' /tmp/w.txt || { echo "::error::the gate on core/$k.mjs was capped: not every mutant was tried"; exit 1; }
          done
      - name: Phase 1 — break-it and konomi-slm as nodes on the foundation; the receipt must reproduce byte for byte
        run: |
          node -e "const n=require('./core/nodes.json');for(const [r,c] of Object.entries(n.nodes))console.log(r+' '+c)" > /tmp/nodes.txt
          while read repo commit; do
            mkdir -p .nodes/$repo
            git -C .nodes/$repo init -q
            git -C .nodes/$repo fetch -q --depth 1 https://github.com/sjgant80-hub/$repo.git $commit
            git -C .nodes/$repo checkout -q FETCH_HEAD
          done < /tmp/nodes.txt
          # the foundation as it was when Phase 1 was measured: the organs have grown since (Phase 3: sync, expire, one
          # packet heard at a time), and Phase 1's receipt is about the foundation break-it and konomi-slm carried then
          git worktree add -q .phase1 b19478fd0dba6af9495afce37cdd1cb3c2861be5
          node .phase1/core/prove.mjs --nodes .nodes --check
      - name: Phase 2 — the edge, its page, and the door measured as a barrier; the receipt must reproduce byte for byte from fresh clones
        run: |
          node --test core/edge.test.mjs core/mesh.test.mjs core/phase2/judge.test.mjs core/phase2/page.test.mjs core/phase2/census.test.mjs
          node core/phase2/measure.mjs --check
      - name: Phase 3 — the mesh live, every node and relay its own process on local TCP; the receipt must reproduce byte for byte
        run: |
          node --test core/relay.test.mjs core/roster.test.mjs core/phase3/judge.test.mjs core/phase3/page.test.mjs
          node core/phase3/measure.mjs --check
      - name: Phase 3b — the fix for J3 and J4, Phase 3's scenario run with both routings side by side; the receipt must reproduce byte for byte, from the commit it was measured at
        run: |
          node --test core/phase3b/judge.test.mjs
          # Phase 3c changed how a note is judged (core/node.mjs), and Phase 3b's receipt is about the node it measured, W4's
          # failure included: it is re-derived from that commit, as Phase 1's is from b19478f. Never rewritten.
          git worktree add -q .phase3b 2960fae3c114ea728d43c734a93bf4fe9a6a1ff3
          node .phase3b/core/phase3b/measure.mjs --check
      - name: Phase 3c — a false note is refused by name; Phase 3b's measurement re-run on the changed node; the receipt must reproduce byte for byte
        run: |
          node --test core/phase3c/judge.test.mjs
          node core/phase3c/measure.mjs --check

  phase4:
    # the organism's whole life takes about forty minutes (24,000 signed asks through every door), so it has a job of its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phase 4 — the self-model, the gate, the judge and the page
        run: node --test core/selfmodel.test.mjs core/growth.test.mjs core/phase4/judge.test.mjs core/phase4/page.test.mjs
      - name: Phase 4 — dex-frontier's loaders and data, byte for byte at the pinned commit
        run: node core/phase4/vendor-dex.mjs --check
      - name: Phase 4 — the organism lived twice from the pinned data; the receipt must reproduce byte for byte
        run: node core/phase4/measure.mjs --check

  phase5:
    # the red team is Phase 2's sealed corpus, built from fresh clones; break-it and konomi-slm are cloned at their sealed
    # commits and each node runs in its own process. The tab and local-model facts are committed files, re-judged here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phase 5 — the door, the mind, the walker, the judge and the page
        run: node --test core/site.test.mjs core/mind.test.mjs core/egress.test.mjs core/phase5/judge.test.mjs core/phase5/page.test.mjs
      - name: Phase 5 — the living website measured; the receipt and the tab's red team must reproduce byte for byte
        run: node core/phase5/measure.mjs --check
      - name: Phase 5b — the fix for M3, its judge, and its receipt re-derived from the tab's raw replies; Phase 5 measured again; byte for byte
        run: |
          node --test core/phase5b/judge.test.mjs
          node core/phase5b/measure.mjs --check

  phase6:
    # four nodes in four processes, the auditor's books, the switch and both paths on copies; the tab's facts re-judged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phase 6 — the second hand, the judge and the page
        run: node --test core/economy.test.mjs core/phase6/judge.test.mjs core/phase6/page.test.mjs
      - name: Phase 6 — the books kept and measured; the receipt, the books and the evidence must reproduce byte for byte
        run: node core/phase6/measure.mjs --check

  phase6b:
    # the fix for C8: a node's name bound to its key; the nine attacks, the merge, the control, Phase 6 re-derived inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phase 6b — the rule, the judge and the page
        run: node --test core/names.test.mjs core/phase6b/judge.test.mjs core/phase6b/page.test.mjs core/phase6/page.test.mjs
      - name: Phase 6b — the fix measured; the receipt must reproduce byte for byte
        run: node core/phase6b/measure.mjs --check

  phase7:
    # client builds: the client's node in the estate's mesh, the client's own organism from a seed, the pilot as the wedge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Phase 7 — the seed and the judge
        run: node --test core/seed.test.mjs core/phase7/judge.test.mjs
      - name: Phase 7 — three worlds in twelve processes and the pilot measured; the receipt must reproduce byte for byte
        run: node core/phase7/measure.mjs --check
      - name: Phase 7 — the page
        run: node --test core/phase7/page.test.mjs
